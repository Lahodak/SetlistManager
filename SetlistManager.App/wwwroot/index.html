<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SetlistManager</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SetlistManager.App.styles.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="stylesheet" href="css/portal-shared.css" />
    <link rel="stylesheet" href="css/song-dialog-shared.css" />
    <link rel="stylesheet" href="css/setlist-dialog-shared.css" />
    <link rel="stylesheet" href="css/auth-shared.css" />

    <style>
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3f51b5;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20% auto 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .welcome {
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            font-size: 2rem;
            color: #3f51b5;
            text-align: center;
            opacity: 0;
            animation: fadeIn 600ms ease-out forwards;
        }

        .ready {
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            font-size: 1rem;
            color: #3f51b5;
            text-align: center;
            opacity: 0;
            animation: fadeIn 1600ms ease-out forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>

    <body>
        <div id="app">
            <div class="loader"></div>
            <h1 class="welcome">Welcome to Setlist Manager</h1>
            <h3 class="ready">Ready to rock?</h3>
        </div>

        <div id="blazor-error-ui">
            An unhandled error has occurred.
            <a href="" class="reload">Reload</a>
            <a class="dismiss">🗙</a>
        </div>
        <script src="_framework/blazor.webassembly.js"></script>
        <script src="_content/MudBlazor/MudBlazor.min.js"></script>
        <script src="js/room.js"></script>
        <script>
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
        </script>
        <script src="js/genius.js"></script>
        <script src="js/autoscroll.js"></script>
        <script src="js/fullscreen.js"></script>
    </body>
</html>
